name = "fixed-upper"
version = "0.1.0"
defaultTargets = ["PagingWithDelay"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# The human-facing files sit at the repository root: `PagingWithDelay.lean`
# (the main theorems), `Model.lean` (the trusted definitions), `EventLoop.lean`
# (the FIFO event loop) and `Algorithm.lean` (FIFO as an `Algorithm`).  The
# proofs live under `Proofs/`.
[[lean_lib]]
name = "PagingWithDelay"
roots = ["PagingWithDelay", "Model", "EventLoop", "Algorithm"]
globs = ["PagingWithDelay", "Model", "EventLoop", "Algorithm", "Proofs.+"]

# Sanity checks on the statements; not imported by the library.
# Build with `lake build Checks`.
[[lean_lib]]
name = "Checks"
globs = ["Checks.+"]
